    <!-- CSS Variables for Themes -->
    <style>
        :root {
            --term-bg: #000000;
            --term-main: #00ff41;
            --term-dim: #008f11;
            --term-glow: rgba(0, 255, 65, 0.5);
        }

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'term-bg': 'var(--term-bg)',
                        'term-green': 'var(--term-main)',
                        'term-green-glow': 'var(--term-glow)',
                        'term-dim': 'var(--term-dim)'
                    },
                    fontFamily: {
                        'mono': ['"Fira Code"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: var(--term-bg);
            color: var(--term-main);
            font-family: 'Fira Code', monospace;
            overflow: hidden;
            margin: 0;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
        }

        /* CRT Scanline effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        /* Glowing text effect */
        .glow {
            text-shadow: 0 0 5px var(--term-main), 0 0 10px var(--term-glow);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--term-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--term-dim);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--term-main);
        }

        /* Terminal Input Styling */
        input[type="text"] {
            background: transparent;
            border: none;
            color: var(--term-main);
            outline: none;
            font-family: 'Fira Code', monospace;
            flex-grow: 1;
            caret-color: var(--term-main);
        }

        .link-hover:hover {
            color: #fff;
            background-color: var(--term-dim);
            text-decoration: none;
        }

        /* Prevent zooming and panning on game canvas for mobile */
        canvas {
            touch-action: none;
        }

        /* RED ALERT & GLITCH EFFECTS */
        .bg-red-alert {
            background-color: #1a0000 !important;
        }
        .red-alert-text {
            color: #ff003c !important;
            text-shadow: 0 0 5px #ff003c, 0 0 10px #ff003c80 !important;
        }
        
        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 2px) }
            40% { transform: translate(-2px, -3px) }
            60% { transform: translate(3px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-mode {
            animation: glitch-anim 0.15s linear infinite;
        }
    </style>
</head>

        // ---------- MỞ / ĐÓNG ẢNH ----------
        function openModal(imgSrc) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
            setTimeout(() => { cmdInput.focus(); }, 350);
        }

        // ---------- MỞ / ĐÓNG VIDEO ----------
        function openVideoModal(videoSrc) {
            const modal = document.getElementById('video-modal');
            const videoElement = document.getElementById('modal-video');
            videoElement.src = videoSrc;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
                videoElement.play(); 
            }, 10);
        }

        function closeVideoModal() {
            const modal = document.getElementById('video-modal');
            const videoElement = document.getElementById('modal-video');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            videoElement.pause();
            videoElement.currentTime = 0;
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
            setTimeout(() => { cmdInput.focus(); }, 350);
        }

        // ---------- GAME 1: KHỦNG LONG VƯỢT RÀO ----------
        function startDino() {
            stopCurrentGame();
            const id = 'dino-' + Date.now();
            printLine(`
            <div class="flex flex-col items-center my-4 w-full">
                <p class="text-yellow-400 mb-2 glow">DINO_RUN.EXE</p>
                <canvas id="${id}" width="300" height="300" class="border-2 border-term-dim rounded-md cursor-pointer shadow-[0_0_15px_var(--term-glow)] block" style="background-color: var(--term-bg)"></canvas>
                
                <button id="btn-jump-${id}" class="mt-3 bg-term-dim text-black font-bold px-8 py-3 rounded active:bg-term-green md:hidden shadow-md">
                    JUMP (NHẢY) ▲
                </button>

                <p class="text-xs text-gray-500 mt-2 text-center">PC: Phím Space / Mũi tên lên / Click | Mobile: Chạm vào màn game hoặc Bấm nút</p>
            </div>`);

            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');

            let dino, obstacles, score, gameover, frame, gameStarted;
            const groundY = 240;
            const gmColor = currentActiveTheme.main;
            const gmDim = currentActiveTheme.dim;
            const gmBg = currentActiveTheme.bg;

            function initGame() {
                dino = { x: 40, y: groundY - 30, width: 20, height: 30, vy: 0, gravity: 0.65, jumpForce: -11, isGrounded: true };
                obstacles = []; score = 0; gameover = false; frame = 0; gameStarted = false;
            }

            initGame();

            function draw() {
                if (gameover) {
                    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "red";
                    ctx.font = "bold 20px 'Fira Code'";
                    ctx.textAlign = "center";
                    ctx.fillText("GAME OVER!", 150, 130);
                    ctx.fillStyle = gmColor;
                    ctx.fillText("Score: " + score, 150, 160);
                    ctx.fillStyle = "white";
                    ctx.font = "14px 'Fira Code'";
                    ctx.fillText("Tap / Space to Restart", 150, 200);
                    return;
                }

                currentGameAnimationId = requestAnimationFrame(draw);

                ctx.fillStyle = gmBg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = gmDim;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(canvas.width, groundY);
                ctx.stroke();

                if (!gameStarted) {
                    ctx.fillStyle = "white";
                    ctx.font = "16px 'Fira Code'";
                    ctx.textAlign = "center";
                    ctx.fillText("Tap / Space to Start", 150, 140);
                    ctx.fillStyle = gmColor;
                    ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
                    ctx.fillStyle = (gmBg === '#ffffff' || gmBg === '#fdf6e3') ? "#000" : (gmColor === '#ffffff' ? '#000' : gmBg);
                    ctx.fillRect(dino.x + 12, dino.y + 4, 4, 4);
                    return;
                }

                dino.vy += dino.gravity;
                dino.y += dino.vy;

                if (dino.y + dino.height >= groundY) {
                    dino.y = groundY - dino.height;
                    dino.vy = 0;
                    dino.isGrounded = true;
                }

                frame++;
                let spawnInterval = Math.max(45, 90 - Math.floor(score / 4));
                if (frame % spawnInterval === 0) {
                    let obsHeight = Math.floor(Math.random() * 20) + 20; 
                    let obsWidth = Math.floor(Math.random() * 10) + 14;  
                    obstacles.push({ x: canvas.width, y: groundY - obsHeight, width: obsWidth, height: obsHeight, passed: false });
                }

                let speed = 3.5 + Math.min(score * 0.1, 5);
                ctx.fillStyle = "#ff003c";
                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.x -= speed;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                    if ( dino.x < obs.x + obs.width && dino.x + dino.width > obs.x &&
                         dino.y < obs.y + obs.height && dino.y + dino.height > obs.y ) {
                        gameover = true;
                    }

                    if (obs.x + obs.width < dino.x && !obs.passed) {
                        score++; obs.passed = true;
                    }
                }

                obstacles = obstacles.filter(obs => obs.x + obs.width > 0);

                ctx.fillStyle = gmColor;
                ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
                ctx.fillStyle = (gmBg === '#ffffff' || gmBg === '#fdf6e3') ? "#000" : (gmColor === '#ffffff' ? '#000' : gmBg);
                ctx.fillRect(dino.x + 12, dino.y + 4, 4, 4);

                ctx.fillStyle = gmColor;
                ctx.font = "bold 14px 'Fira Code'";
                ctx.textAlign = "left";
                ctx.fillText("Score: " + score, 10, 25);
            }

            function doJump(e) {
                if (e) e.preventDefault();
                if (gameover) {
                    if (currentGameAnimationId) cancelAnimationFrame(currentGameAnimationId);
                    initGame(); draw(); return;
                }
                if (!gameStarted) gameStarted = true;
                if (dino.isGrounded) {
                    dino.vy = dino.jumpForce;
                    dino.isGrounded = false;
                }
            }

            canvas.addEventListener('mousedown', doJump);
            canvas.addEventListener('touchstart', doJump, { passive: false });
            if (document.getElementById(`btn-jump-${id}`)) document.getElementById(`btn-jump-${id}`).onclick = doJump;

            const keyHandler = (e) => {
                if (document.activeElement === cmdInput) return;
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') doJump(e);
            };

            window.currentGameKeyHandler = keyHandler;
            window.addEventListener('keydown', window.currentGameKeyHandler, { passive: false });
            draw(); cmdInput.blur();
        }

        // ---------- GAME 2: RẮN SĂN MỒI ----------
        function startSnake() {
            stopCurrentGame();
            const id = 'snake-' + Date.now();
            printLine(`
            <div class="flex flex-col items-center my-4 w-full">
                <p class="text-yellow-400 mb-2 glow">RANSANMOI.EXE</p>
                <canvas id="${id}" width="300" height="300" class="border-2 border-term-dim rounded-md cursor-pointer shadow-[0_0_15px_var(--term-glow)]" style="background-color: var(--term-bg)"></canvas>
                
                <div class="grid grid-cols-3 gap-2 mt-4 md:hidden">
                    <div></div>
                    <button id="btn-up-${id}" class="bg-term-dim text-black font-bold px-5 py-3 rounded active:bg-term-green">▲</button>
                    <div></div>
                    <button id="btn-left-${id}" class="bg-term-dim text-black font-bold px-5 py-3 rounded active:bg-term-green">◀</button>
                    <button id="btn-down-${id}" class="bg-term-dim text-black font-bold px-5 py-3 rounded active:bg-term-green">▼</button>
                    <button id="btn-right-${id}" class="bg-term-dim text-black font-bold px-5 py-3 rounded active:bg-term-green">▶</button>
                </div>
                <p class="text-xs text-gray-500 mt-2 text-center">PC: Phím điều hướng hoặc W A S D | Mobile: Nút bấm</p>
            </div>`);

            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');
            const tileSize = 15;
            const tileCount = 20;

            const gmColor = currentActiveTheme.main;
            const gmBg = currentActiveTheme.bg;

            let snake, food, dx, dy, score, gameover;

            function initGame() {
                snake = [{x: 10, y: 10}]; food = {x: 5, y: 5};
                dx = 0; dy = -1; score = 0; gameover = false;
            }
            initGame();

            function draw() {
                if(gameover) {
                    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "red";
                    ctx.font = "bold 20px 'Fira Code'";
                    ctx.textAlign = "center";
                    ctx.fillText("GAME OVER!", 150, 130);
                    ctx.fillStyle = gmColor;
                    ctx.fillText("Score: " + score, 150, 160);
                    ctx.fillStyle = "white";
                    ctx.font = "14px 'Fira Code'";
                    ctx.fillText("Tap / Space to Restart", 150, 200);
                    return;
                }

                currentGameTimeoutId = setTimeout(() => {
                    currentGameAnimationId = requestAnimationFrame(draw);
                }, 1000 / 10);

                let head = {x: snake[0].x + dx, y: snake[0].y + dy};

                if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) gameover = true;
                for(let i=0; i<snake.length; i++) {
                    if(head.x === snake[i].x && head.y === snake[i].y) gameover = true;
                }

                if(!gameover) {
                    snake.unshift(head);
                    if(head.x === food.x && head.y === food.y) {
                        score++;
                        food = {x: Math.floor(Math.random()*tileCount), y: Math.floor(Math.random()*tileCount)};
                    } else { snake.pop(); }
                }

                ctx.fillStyle = gmBg;
                ctx.fillRect(0,0, canvas.width, canvas.height);
                
                ctx.fillStyle = "red";
                ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize - 1, tileSize - 1);
                
                for(let i=0; i<snake.length; i++) {
                    ctx.fillStyle = i === 0 ? "#ffffff" : gmColor; 
                    ctx.fillRect(snake[i].x * tileSize, snake[i].y * tileSize, tileSize - 1, tileSize - 1);
                }
                
                ctx.fillStyle = currentActiveTheme.glow;
                ctx.font = "14px 'Fira Code'";
                ctx.textAlign = "left";
                ctx.fillText("Score: " + score, 10, 20);
            }

            function restartEvent(e) {
                if(e) e.preventDefault();
                if(gameover) {
                    if (currentGameTimeoutId) clearTimeout(currentGameTimeoutId);
                    initGame(); draw();
                }
            }

            canvas.addEventListener('mousedown', restartEvent);
            canvas.addEventListener('touchstart', restartEvent, {passive: false});

            const keyHandler = (e) => {
                if (document.activeElement === cmdInput) return;
                if (gameover && e.code === 'Space') { restartEvent(e); return; }
                const allowedKeys = ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", "KeyW", "KeyS", "KeyA", "KeyD"];
                if(allowedKeys.includes(e.code)) {
                    e.preventDefault();
                    if((e.code === 'ArrowUp' || e.code === 'KeyW') && dy !== 1) { dx = 0; dy = -1; }
                    if((e.code === 'ArrowDown' || e.code === 'KeyS') && dy !== -1) { dx = 0; dy = 1; }
                    if((e.code === 'ArrowLeft' || e.code === 'KeyA') && dx !== 1) { dx = -1; dy = 0; }
                    if((e.code === 'ArrowRight' || e.code === 'KeyD') && dx !== -1) { dx = 1; dy = 0; }
                }
            };
            window.currentGameKeyHandler = keyHandler;
            window.addEventListener('keydown', window.currentGameKeyHandler, {passive: false});

            if(document.getElementById(`btn-up-${id}`)) {
                document.getElementById(`btn-up-${id}`).onclick = () => { if(dy !== 1) { dx = 0; dy = -1; } };
                document.getElementById(`btn-down-${id}`).onclick = () => { if(dy !== -1) { dx = 0; dy = 1; } };
                document.getElementById(`btn-left-${id}`).onclick = () => { if(dx !== 1) { dx = -1; dy = 0; } };
                document.getElementById(`btn-right-${id}`).onclick = () => { if(dx !== -1) { dx = 1; dy = 0; } };
            }

            draw(); cmdInput.blur(); 
        }

                    ctx.textAlign = "center";
                    ctx.fillText("GAME OVER!", 150, 190);
                    ctx.fillStyle = "white";
                    ctx.fillText("Score: " + score, 150, 220);
                    ctx.fillStyle = "yellow";
                    ctx.font = "14px 'Fira Code'";
                    ctx.fillText("Tap / Space to Restart", 150, 260);
                    return;
                }
                
                currentGameAnimationId = requestAnimationFrame(draw);

                ctx.fillStyle = "#70c5ce"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if(!gameStarted) {
                    ctx.fillStyle = "white";
                    ctx.font = "16px 'Fira Code'";
                    ctx.textAlign = "center";
                    ctx.fillText("Tap / Space to Start", 150, 200);
                    ctx.fillStyle = "#ffcc00";
                    ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
                    return;
                }

                bird.velocity += bird.gravity;
                bird.y += bird.velocity;
                if(bird.y + bird.height >= canvas.height || bird.y < 0) gameover = true;

                if(frame % 100 === 0) {
                    let gap = 110;
                    let pipeY = Math.random() * (canvas.height - gap - 60) + 30;
                    pipes.push({x: canvas.width, y: pipeY, width: 40, gap: gap, passed: false});
                }

                ctx.fillStyle = "#008f11"; 
                for(let i = 0; i < pipes.length; i++) {
                    let p = pipes[i];
                    p.x -= 2.5;
                    ctx.fillRect(p.x, 0, p.width, p.y);
                    ctx.fillRect(p.x, p.y + p.gap, p.width, canvas.height - p.y - p.gap);

                    if(bird.x < p.x + p.width && bird.x + bird.width > p.x &&
                      (bird.y < p.y || bird.y + bird.height > p.y + p.gap)) gameover = true;
                    if(p.x + p.width < bird.x && !p.passed) { score++; p.passed = true; }
                }
                pipes = pipes.filter(p => p.x + p.width > 0); 

                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

                ctx.fillStyle = "black";
                ctx.font = "bold 20px 'Fira Code'";
                ctx.textAlign = "left";
                ctx.fillText("Score: " + score, 10, 30);
                frame++;
            }

            function jumpEvent(e) {
                if(e) e.preventDefault();
                if(gameover) {
                    if (currentGameAnimationId) cancelAnimationFrame(currentGameAnimationId);
                    initGame(); draw(); return;
                }
                if(!gameStarted) gameStarted = true;
                bird.velocity = bird.jump;
            }

            canvas.addEventListener('mousedown', jumpEvent);
            canvas.addEventListener('touchstart', jumpEvent, {passive: false});

            const keyHandler = (e) => {
                if (document.activeElement === cmdInput) return;
                if(e.code === 'Space') jumpEvent(e);
            };
            window.currentGameKeyHandler = keyHandler;
            window.addEventListener('keydown', window.currentGameKeyHandler, {passive: false});

            draw(); cmdInput.blur(); 
        }

        // ---------- CODE HACKER MATRIX ----------
        function startCodeSequence() {
            stopCurrentGame(); 
            
            printLine("<span class='text-yellow-400 mb-1 block'>[!] INITIATING SYSTEM OVERRIDE... HACKING MATRIX</span>");
            printLine("<span class='text-gray-500 mb-3 block'>Mẹo: Gõ <b class='text-white'>clear</b> hoặc <b class='text-white'>home</b> để dừng lệnh này.</span>");
            
            let num = 0;
            function generateNumbers() {
                let chunk = '';
                for(let i = 0; i < 30; i++) { chunk += (num++) + " "; }
                
                const div = document.createElement('div');
                div.className = "text-term-dim break-all text-justify font-mono";
                div.textContent = chunk;
                outputDiv.appendChild(div);
                
                while (outputDiv.childElementCount > 60) { outputDiv.removeChild(outputDiv.firstElementChild); }
                
                scrollToBottom();
                currentGameAnimationId = requestAnimationFrame(generateNumbers);
            }
            generateNumbers();
        }

        // ========================================================
        // CORE SYSTEM 
        // ========================================================
        function showWelcomeMessage() {
            printLine(`<pre class="glow hidden sm:block text-term-dim leading-none">${asciiArt}</pre>`);
            printLine("<span class='text-white font-bold text-lg'>Welcome to Son's Interactive Bio-Terminal.</span>");
            printLine("Type <span class='glow text-white'>'help'</span> to see available commands or use the buttons below.<br>");
            scrollToBottom();
        }

        async function typeText(text, element, speed = 20) {
            return new Promise(resolve => {
                let i = 0;
                element.innerHTML += "<br>";
                const typingInterval = setInterval(() => {
                    if (i < text.length) {
                        if (text.charAt(i) === '\n') element.innerHTML += "<br>";
                        else element.innerHTML += text.charAt(i);
                        scrollToBottom();
                        i++;
                    } else {
                        clearInterval(typingInterval); resolve();
                    }
                }, speed);
            });
        }

        function processCommand(rawCmd) {
            printLine(userPrompt + `<span class="text-white">${rawCmd}</span>`);
            const cmdLower = rawCmd.trim().toLowerCase();
            
            if (cmdLower === '') return;

            // Xóa màn hình
            if (cmdLower === 'clear') { outputDiv.innerHTML = ''; stopCurrentGame(); return; }

            // Trở về Home 
            if (cmdLower === 'home') { outputDiv.innerHTML = ''; stopCurrentGame(); showWelcomeMessage(); return; }

            // Tự hủy
            if (cmdLower === 'sudo rm -rf /' || cmdLower === 'sudo' || cmdLower === 'destroy' || cmdLower === 'rm -rf /') {
                triggerSelfDestruct(); return;
            }

            // GIAO DIỆN (THEMES)
            if (cmdLower === 'theme' || cmdLower === 'themes') {
                printLine(`
[+] HỆ THỐNG GIAO DIỆN (THEMES):
Cú pháp: <b class="text-white">theme [tên_theme]</b>
Danh sách các theme hiện có:
  1. <b style="color: #00ff41">matrix</b> - Xanh lục Hacker (Mặc định)
  2. <b style="color: #ff3333">blood</b>  - Đỏ rực bí ẩn
  3. <b style="color: #00ffff">cyber</b>  - Xanh lơ Cyberpunk
  4. <b style="color: #ffffff">ubuntu</b> - Phong cách Ubuntu (Tím/Cam)
  5. <b style="color: #82aaff">ocean</b>  - Xanh đáy biển sâu
  6. <b style="color: #ffd700">gold</b>   - Vàng Hoàng Gia Retro
`);
                return;
            }
            if (cmdLower.startsWith('theme ')) {
                const requestedTheme = cmdLower.split(' ')[1];
                if (applyTheme(requestedTheme)) {
                    printLine(`<span class='text-term-green glow'>[OK] Đã chuyển đổi sang giao diện: ${themeConfig[requestedTheme].name}</span>`);
                } else {
                    printLine(`<span class='text-red-500'>[Lỗi] Không tìm thấy theme '${requestedTheme}'. Gõ 'theme' để xem danh sách.</span>`);
                }
                return;
            }

            // Chat AI
            if (cmdLower.startsWith('askson')) {
                const question = rawCmd.substring(6).trim();
                processAskSon(question); return;
            }

            // MINIGAME SỬA LOA (REPAIR)
            if (cmdLower === 'repair' || cmdLower === 'sualoa' || cmdLower === 'suado') {
                startRepairGame();
                return;
            }

            // LỆNH MUSIC ĐÃ CẬP NHẬT THEO YÊU CẦU MỚI
            if (cmdLower === 'music') {
                printLine("<span class='text-yellow-400 font-bold'>[!] LOA ĐÀI ĐANG BỊ HỎNG!</span> Không thể phát nhạc ngay lúc này.");
                printLine("Vui lòng gõ lệnh <b class='text-white glow'>repair</b> để trổ tài sửa chữa Loa Amply. Khi sửa thành công, nhạc Bolero sẽ tự động vang lên!");
                return;
            }

            // Games khác
            if (cmdLower === 'dino' || cmdLower === 'khunglong') { startDino(); return; }
            if (cmdLower === 'code') { startCodeSequence(); return; }
            if (cmdLower === 'ransanmoi') { startSnake(); return; }
            if (cmdLower === 'flappybird') { startFlappy(); return; }

            // Easter Egg
            if (cmdLower === 'người yêu' || cmdLower === 'ny') {
                printLine('<span class="text-red-500 glow text-lg font-bold">Error 404: Not Found 💔. Thử dùng lệnh: askson có người yêu chưa?</span>'); return;
            }

            // Commands thông thường
            if (commands[cmdLower]) {
                printLine(commands[cmdLower]);
            } else {
                printLine(`bash: ${rawCmd}: command not found. Type 'help' to see available commands.`);
            }
        }

        async function bootSequence() {
            const bootMsg = document.createElement('span');
            bootMsg.className = "text-term-dim";
            outputDiv.appendChild(bootMsg);

            await typeText("son@cva-k119:~$ booting system...", bootMsg, 30);

            setTimeout(() => {
                printLine("<span class='text-yellow-400'>[OK] Kernel loaded.</span>");
                printLine("<span class='text-yellow-400'>[OK] Mounting filesystems...</span>");
                printLine("<span class='text-yellow-400'>[OK] Starting CVA K119 Interface...</span>");

                setTimeout(() => {
                    showWelcomeMessage();
                    inputWrapper.classList.remove('hidden');
                    cmdInput.focus();
                }, 500);
            }, 400);
        }

        cmdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !isSelfDestructing) {
                const cmd = this.value;
                this.value = '';
                processCommand(cmd);
            }
        });

        terminalContainer.addEventListener('click', (e) => {
            if (
                !isSelfDestructing && 
                e.target.tagName !== 'CANVAS' && 
                e.target.tagName !== 'BUTTON' && 
                e.target.tagName !== 'IMG' && 
                e.target.tagName !== 'VIDEO' &&
                !e.target.closest('#image-modal') && 
                !e.target.closest('#video-modal') && 
                window.getSelection().toString() === ''
            ) {
                cmdInput.focus();
            }
        });

        window.onload = () => {
            bootSequence();
        };

    </script>
